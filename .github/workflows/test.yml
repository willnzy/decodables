# Backend Test Suite - GitHub Actions
# Runs on every push and PR to main branch

name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  TESTING: 'true'

jobs:
  # ============================================
  # Unit Tests
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Run unit tests
        run: |
          pytest tests/test_payment_service.py tests/test_tier_logic.py -v --tb=short
        env:
          TESTING: 'true'
          STRIPE_SECRET_KEY: 'sk_test_mock'
          STRIPE_WEBHOOK_SECRET: 'whsec_test_mock'

  # ============================================
  # Integration Tests (with mocked DB)
  # ============================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Run integration tests
        run: |
          pytest tests/ -v --tb=short --ignore=tests/test_payment_service.py --ignore=tests/test_tier_logic.py
        env:
          TESTING: 'true'
          STRIPE_SECRET_KEY: 'sk_test_mock'
          STRIPE_WEBHOOK_SECRET: 'whsec_test_mock'
          SUPABASE_URL: 'https://mock.supabase.co'
          SUPABASE_KEY: 'mock_key'

  # ============================================
  # Payment Tests (Critical)
  # ============================================
  payment-tests:
    name: Payment Tests (Critical)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Run Stripe payment tests
        run: |
          pytest tests/test_payment_service.py tests/test_webhook_handler.py tests/test_admin_payment.py -v --tb=short
        env:
          TESTING: 'true'
          STRIPE_SECRET_KEY: 'sk_test_mock'
          STRIPE_WEBHOOK_SECRET: 'whsec_test_mock'

  # ============================================
  # Code Quality
  # ============================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install linters
        run: |
          pip install flake8 black isort
      
      - name: Run flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true
      
      - name: Check formatting with black
        run: black --check --diff . || true
        continue-on-error: true

  # ============================================
  # Security Scan
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install pip-audit safety
      
      - name: Run pip-audit
        run: pip-audit -r requirements.txt || true
        continue-on-error: true

  # ============================================
  # Test Summary
  # ============================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, payment-tests]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "✅ Unit Tests: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Unit Tests: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.payment-tests.result }}" == "success" ]; then
            echo "✅ Payment Tests: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Payment Tests: Failed" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Fail if critical tests failed
        if: needs.unit-tests.result == 'failure' || needs.payment-tests.result == 'failure'
        run: exit 1

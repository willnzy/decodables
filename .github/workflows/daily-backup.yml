name: Daily Backup (Database + Storage)

on:
  schedule:
    # UTC 02:00 = 北京时间 10:00
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (只检查配置，不实际备份)'
        required: false
        default: false
        type: boolean
      skip_database:
        description: 'Skip database backup'
        required: false
        default: false
        type: boolean
      skip_storage:
        description: 'Skip storage backup'
        required: false
        default: false
        type: boolean

jobs:
  # ============ 数据库备份 ============
  backup-database:
    if: ${{ inputs.skip_database != true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # 安装 Python 依赖
          pip install boto3
          
          # 更新 apt 并安装基础工具
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          
          # 添加 PostgreSQL 官方 APT 源
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          
          # 再次更新 apt（加载新源）
          sudo apt-get update
          
          # 安装 PostgreSQL 17 客户端
          sudo apt-get install -y postgresql-client-17
          
          # 验证安装
          echo "=== 验证安装 ==="
          echo "pg_dump version:"
          /usr/lib/postgresql/17/bin/pg_dump --version
          echo "gpg version:"
          gpg --version

      - name: Run database backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          PATH: /usr/lib/postgresql/17/bin:$PATH
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "🔍 Running database backup in dry-run mode..."
            python scripts/backup/backup_lite.py --dry-run --verbose
          else
            python scripts/backup/backup_lite.py --verbose
          fi

      - name: Send database backup failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 🚨 Make Decodables 数据库备份失败
          to: ${{ secrets.EMAIL_USERNAME }}
          from: Make Decodables Backup <${{ secrets.EMAIL_USERNAME }}>
          body: |
            ⚠️ 数据库备份失败！
            
            仓库: ${{ github.repository }}
            运行 ID: ${{ github.run_id }}
            
            请检查日志:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            --
            Make Decodables 自动备份系统

      - name: Database backup success log
        if: success() && inputs.dry_run != true
        run: echo "✅ Database backup completed successfully at $(date)"

  # ============ Storage 增量备份 ============
  backup-storage:
    if: ${{ inputs.skip_storage != true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install boto3 httpx

      - name: Run storage backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_STORAGE_BUCKET: ${{ secrets.R2_STORAGE_BUCKET }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "🔍 Running storage backup in dry-run mode..."
            python scripts/backup/backup_storage.py --dry-run --verbose
          else
            python scripts/backup/backup_storage.py --verbose
          fi

      - name: Send storage backup failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 🚨 Make Decodables Storage 备份失败
          to: ${{ secrets.EMAIL_USERNAME }}
          from: Make Decodables Backup <${{ secrets.EMAIL_USERNAME }}>
          body: |
            ⚠️ Storage 增量备份失败！
            
            仓库: ${{ github.repository }}
            运行 ID: ${{ github.run_id }}
            
            请检查日志:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            --
            Make Decodables 自动备份系统

      - name: Storage backup success log
        if: success() && inputs.dry_run != true
        run: echo "✅ Storage backup completed successfully at $(date)"

# Railway Configuration for Make Decodables
# https://docs.railway.app/reference/config-as-code

# ==========================================
# Web Service (FastAPI)
# ==========================================
[build]
  builder = "NIXPACKS"
  # Clean up empty directories that conflict with .py files (Python import precedence issue)
  buildCommand = "find . -type d -empty -delete && pip install -r requirements.txt"

[deploy]
  startCommand = "uvicorn app:app --host 0.0.0.0 --port $PORT --workers 2"
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3

# Health check configuration
[deploy.healthcheck]
  path = "/health"
  timeout = 30
  interval = 60

# Service replicas (horizontal scaling)
# Uncomment to scale web service
# [deploy.replicas]
#   min = 2
#   max = 5

